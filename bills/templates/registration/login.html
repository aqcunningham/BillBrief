<!doctype html>
<html><head><meta charset="utf-8"><title>Editor login · BillBrief</title>
<style>
  body{font-family:system-ui;background:#f6f7f9;display:grid;place-items:center;min-height:100vh;margin:0}
  form{background:#fff;padding:32px;border-radius:12px;box-shadow:0 2px 12px #0001;width:320px}
  h1{font-size:20px;margin:0 0 16px} label{display:block;font-size:14px;margin-top:12px}
  input{width:100%;padding:8px;margin-top:4px;box-sizing:border-box}
  button{margin-top:20px;width:100%;padding:10px;background:#1d4ed8;color:#fff;border:0;border-radius:8px;font-size:15px}
  .err{color:#b91c1c;font-size:14px}
</style></head>
<body>
  <form method="post">
    {% csrf_token %}
    <h1>BillBrief editor login</h1>
    {% if form.errors %}<p class="err">Wrong username or password.</p>{% endif %}
    <label>Username {{ form.username }}</label>
    <label>Password {{ form.password }}</label>
    <button type="submit">Log in</button>
  </form>
</body></html>
